name: GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy site/ and drop draft pages
        # Any folder containing a file named DRAFT is left out of the deploy.
        run: |
          cp -R site _site
          find _site -mindepth 2 -name DRAFT -type f | while read -r f; do
            echo "Skipping draft: $(dirname "$f")"
            rm -rf "$(dirname "$f")"
          done
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: justincdominic.com
          enable_jekyll: false
